# ============================================================
# Cloudflare Workers 配置文件
# 黄金价格检测系统 - 后端服务
# ============================================================
name = "gold-price-monitor-api"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ============================================================
# 自定义域名配置
# ============================================================
[[routes]]
pattern = "gold-backend.chuankangkk.top"
custom_domain = true

# ============================================================
# 定时任务配置（Cron Triggers）
# 每30分钟触发一次价格监控和推送
# ============================================================
[triggers]
crons = ["*/30 * * * *"]

# ============================================================
# 环境变量配置
# ============================================================
[vars]
# 敏感信息一律使用 wrangler secret 设置，不要写在这里：
#   npx wrangler secret put ADMIN_TOKEN        # 推送/监控接口的 Bearer Token（未设置则这些接口禁用）
#   npx wrangler secret put PUSHPLUS_TOKEN     # PushPlus Token
#   npx wrangler secret put PUSHPLUS_TOPIC     # PushPlus 群组编码（可选）
#   npx wrangler secret put MODELSCOPE_API_KEY # AI 分析（可选，未设置则使用规则摘要）

# 可选：绑定 KV 以持久化推送/预警状态（未绑定时状态只存在内存，实例回收后会丢失）
# 创建：npx wrangler kv namespace create GOLD_KV，然后取消下面的注释并填入返回的 id
# [[kv_namespaces]]
# binding = "GOLD_KV"
# id = "your-kv-namespace-id"

# ============================================================
# Cloudflare Workers AI 绑定（免费内置大模型支持，无需额外 API Key）
# ============================================================
[ai]
binding = "AI"

# ============================================================
# 开发环境配置
# ============================================================
[dev]
port = 8787
local_protocol = "http"
