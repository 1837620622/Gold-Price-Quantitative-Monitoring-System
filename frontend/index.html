<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="黄金量化终端：国内 AU9999 与国际 XAU/USD 实时行情、多因子量化信号、跨市溢价与基差、回测、AI 研报与微信推送。" />
    <meta name="theme-color" content="#050507" />
    <title>Gold Monitor · 黄金量化终端</title>
    <script>
      // 首屏主题与语言：先读取访客上次保存的选择，避免闪烁；随后由应用按访客位置校正
      (function () {
        try {
          var mode = localStorage.getItem('gold-monitor-theme-mode');
          var auto = localStorage.getItem('gold-monitor-theme-auto');
          var theme = mode === 'day' ? 'light' : mode === 'night' ? 'dark' : auto === 'light' ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark';
          document.documentElement.lang = localStorage.getItem('gold-monitor-locale') === 'en' ? 'en' : 'zh-CN';
        } catch (e) {
          // 存储不可用时保持默认深色与中文
        }
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <noscript>请开启 JavaScript 以查看黄金行情 · Please enable JavaScript to view gold prices.</noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
